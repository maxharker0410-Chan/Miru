name: Windows Companion test build

on:
  push:
    branches: [develop/companion-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Prepare Python environment
        run: |
          python -m venv .venv-windows
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
          & .\.venv-windows\Scripts\python.exe -m pip install -r requirements.txt 'pyinstaller>=6.11,<7'
          if ($LASTEXITCODE -ne 0) { throw 'dependency installation failed' }
      - name: Prepare Rust
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - name: Build Windows application and test native pet
        run: ./build_windows.ps1 -SkipDependencies -SkipInstaller
      - name: Verify packaged character files and add instructions
        run: |
          $required = @(
            'dist/Miru/Miru.exe',
            'dist/Miru/miru-pet.exe',
            'dist/Miru/_internal/templates/pet.html',
            'dist/Miru/_internal/assets/js/companion/character-adapter.js',
            'dist/Miru/_internal/assets/js/companion/sprite-adapter.js'
          )
          foreach ($state in @('idle','blink','talking','thinking','happy','sad','surprised','sleeping')) {
            $required += "dist/Miru/_internal/assets/companion/portrait/$state.png"
          }
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing packaged file: $path" }
          }
          @'
          Miru Companion Windows 測試版

          1. 將下載的 ZIP 全部解壓縮；不要只取出 Miru.exe。
          2. 先完全關閉原本的 Miru，再開啟此資料夾的 Miru.exe。
          3. 顯示桌寵後，按工具列「圖片」切換到紫髮角色。
          4. 檢查眨眼、傳訊息時的思考與回覆姿勢、拖曳和縮放。
          5. 關閉再重新開啟，確認角色選擇與位置保留。

          本包不包含 Live2D SDK／Hiyori 模型；初次若未顯示模型，請按「圖片」。
          需要 Windows x64 與 WebView2 Runtime。聊天仍需要原本的服務設定。
          此測試版使用與原版相同的 Miru 使用者設定和資料位置。
          不要同時執行兩個版本。這不是安裝程式，也尚未完成 Windows 人工驗收。
          '@ | Set-Content dist/Miru/READ-ME-FIRST.txt -Encoding utf8BOM
          Copy-Item LICENSE dist/Miru/LICENSE.txt
          Copy-Item assets/companion/portrait/README.md dist/Miru/CHARACTER-ASSETS.md
          "Build commit: $env:GITHUB_SHA" | Set-Content dist/Miru/BUILD.txt
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: Miru-Companion-Windows-x64-${{ github.run_number }}
          path: dist/Miru/
          if-no-files-found: error
          retention-days: 14
