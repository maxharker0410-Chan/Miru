name: S. Chat Windows test build

on:
  push:
    branches: [develop/companion-v1, feature/schat-story]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Prepare Python environment
        run: |
          python -m venv .venv-windows
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
          & .\.venv-windows\Scripts\python.exe -m pip install -r requirements.txt 'pyinstaller>=6.11,<7'
          if ($LASTEXITCODE -ne 0) { throw 'dependency installation failed' }
      - name: Prepare Rust
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - name: Build Windows application and test native pet
        run: ./build_windows.ps1 -SkipDependencies -SkipInstaller
      - name: Verify packaged story studio and add instructions
        run: |
          $required = @(
            'dist/S.Chat/S.Chat.exe',
            'dist/S.Chat/miru-pet.exe',
            'dist/S.Chat/_internal/templates/s-chat.html'
          )
          foreach ($state in @('idle','blink','talking','thinking','happy','sad','surprised','sleeping')) {
            $required += "dist/S.Chat/_internal/assets/companion/portrait/$state.png"
          }
          foreach ($state in @('idle','thinking','shy','sleeping','sad','angry')) {
            $required += "dist/S.Chat/_internal/assets/companion/portrait/home/$state.png"
          }
          foreach ($state in @('idle','blink','talking','thinking','happy','surprised','shy')) {
            $required += "dist/S.Chat/_internal/assets/companion/portrait/outdoor/$state.png"
          }
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing packaged file: $path" }
          }
          @'
          S. Chat Windows 故事測試版

          1. 將 ZIP 全部解壓縮，再執行 S.Chat.exe；請先關閉舊版 Miru。
          2. 使用原本的登入和聊天模型設定。建立故事，填寫世界觀、角色與場景。
          3. 可上傳背景圖片與角色透明立繪；替場景勾選在場角色及下一場景。
          4. 儲存並開始故事。多名角色可同場出現，故事推進時背景自動切換。
          5. 每名角色的記憶獨立保存；關閉重開後可接續遊玩。

          需要 Windows x64、WebView2 Runtime 與已設定的聊天模型 API。
          這個 ZIP 是測試版，尚未完成 Windows 人工驗收。
          資料沿用原 Miru 本機設定位置；請勿同時開啟兩個版本。
          '@ | Set-Content dist/S.Chat/READ-ME-FIRST.txt -Encoding utf8BOM
          Copy-Item LICENSE dist/S.Chat/LICENSE.txt
          "Build commit: $env:GITHUB_SHA" | Set-Content dist/S.Chat/BUILD.txt
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: S.Chat-Windows-x64-${{ github.run_number }}
          path: dist/S.Chat/
          if-no-files-found: error
          retention-days: 14
