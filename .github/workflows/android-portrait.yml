name: Android Portrait APK

on:
  push:
    branches: [develop/companion-v1]
    paths:
      - mobile-portrait/**
      - assets/companion/portrait/**
      - .github/workflows/android-portrait.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: bash miru-mobile/android/gradlew -p mobile-portrait/android --no-daemon assembleDebug
      - name: Check embedded portrait images
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          apk = 'mobile-portrait/android/app/build/outputs/apk/debug/app-debug.apk'
          states = ('idle', 'blink', 'thinking', 'talking', 'happy', 'sad', 'surprised', 'sleeping')
          home = ('idle', 'thinking', 'shy', 'sleeping', 'sad', 'angry')
          outdoor = ('idle', 'blink', 'talking', 'thinking', 'happy', 'surprised', 'shy')
          with ZipFile(apk) as package:
              expected = ['assets/' + state + '.png' for state in states]
              expected += ['assets/home/' + state + '.png' for state in home]
              expected += ['assets/outdoor/' + state + '.png' for state in outdoor]
              missing = [path for path in expected if path not in package.namelist()]
          assert not missing, f'Missing images: {missing}'
          print('All 21 portrait images included in APK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MiruPortrait-debug-apk
          path: mobile-portrait/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
